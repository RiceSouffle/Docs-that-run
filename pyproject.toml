[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Read from docsthatrun/__init__.py so the version lives in exactly one
# place; see [tool.setuptools.dynamic] below.
name = "docsthatrun"
dynamic = ["version"]
description = "Version-aware documentation RAG with execution-graded answers (Pydantic v1 -> v2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []  # core is standard-library only

[project.optional-dependencies]
# Floor is the version this is tested against. The previous >=0.40 could not
# run this code at all: llm.py uses thinking={"type": "adaptive"} and
# output_config, neither of which exists in 0.40.
llm = ["anthropic>=0.117"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
docsthatrun = "docsthatrun.cli:main"

[tool.setuptools]
packages = ["docsthatrun", "docsthatrun.evals"]

[tool.setuptools.dynamic]
version = { attr = "docsthatrun.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Put the repo root on sys.path so `docsthatrun` / `app` import under the bare
# `pytest` console script (CI), not only under `python -m pytest` (which adds the
# CWD itself). Without this, CI collection fails with ModuleNotFoundError.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Correctness-focused: pyflakes (F), pycodestyle (E/W), import order (I),
# flake8-bugbear (B). Pyupgrade (UP) is intentionally off — the codebase targets
# 3.9 and the modernizations are churn, not correctness.
select = ["E", "F", "W", "I", "B"]
