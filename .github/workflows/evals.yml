name: evals

on:
  push:
  pull_request:

# A newer push supersedes any still-running build of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
          cache: pip

      # The sandbox venvs embed the interpreter path, so key the cache on the
      # exact patch version (a runner-image Python bump would break stale venvs).
      - name: Cache sandbox venvs
        uses: actions/cache@v4
        with:
          path: .venvs
          key: sandbox-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('scripts/setup_sandbox.sh') }}

      - name: Build the pinned-version sandbox venvs
        run: bash scripts/setup_sandbox.sh

      - name: Install test + server deps
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check docsthatrun app tests

      - name: Unit tests (retrieval + sandbox version-lock)
        run: pytest -q

      # Retrieval metrics are real; execution grading is real (venvs built above).
      # The answer layer uses the offline MockClient so CI needs no API key.
      - name: Eval gate
        run: |
          python -m docsthatrun.evals.run_evals --answers --gate \
            --client mock --json results/ci-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: results/ci-report.json

  # Proves the README claim, not just states it: the retrieval + eval core runs
  # on a bare Python 3.9 with zero pip installs.
  core-stdlib-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Retrieval evals on bare stdlib (no pip install)
        run: python -m docsthatrun.evals.run_evals
